[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "0.1.0"
description = "A firewall proxy for AI agent tool calls over the Model Context Protocol"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",   # official MCP Python SDK (v2 API)
    "pyyaml>=6",
]

[project.optional-dependencies]
llm = ["anthropic>=1"]   # only needed for the LLM detector
dev = ["pytest>=8"]

[project.scripts]
mcp-guard = "mcp_guard.__main__:main"

[tool.setuptools]
packages = ["mcp_guard", "mcp_guard.detectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
